name: Deploy Static Website

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Static Assets
        run: |
          mkdir -p dist
          cp -r * dist || true
          echo "Build complete."

      - name: Upload Website Files
        uses: actions/upload-artifact@v4
        with:
          name: static-files
          path: dist/

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run HTML Validation (optional)
        run: |
          echo "No tests for static site. Skipping or add HTML/CSS lint here."

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Website Files
        uses: actions/download-artifact@v4
        with:
          name: static-files

      - name: Build Docker Image
        run: |
          docker build -t static-website:latest .

      - name: Save Docker Image
        run: docker save static-website:latest -o static-website.tar

      - name: Upload Docker Image Tar
        uses: actions/upload-artifact@v4
        with:
          name: static-docker-image
          path: static-website.tar

  docker-tag:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: static-docker-image

      - name: Load Image and Tag
        run: |
          docker load -i static-website.tar
          docker tag static-website:latest your-dockerhub-username/static-website:latest

  docker-push:
    runs-on: ubuntu-latest
    needs: docker-tag

    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull Docker Image Tar
        uses: actions/download-artifact@v4
        with:
          name: static-docker-image

      - name: Load and Push to DockerHub
        run: |
          docker load -i static-website.tar
          docker push static-website:latest your-dockerhub-username/static-website:latest
