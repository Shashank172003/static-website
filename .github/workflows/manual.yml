name: Deploy Static Website

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Static Assets
        run: |
          mkdir -p dist
          cp -r * dist || true
          echo "Build complete."

      - name: Upload Website Files
        uses: actions/upload-artifact@v4
        with:
          name: static-files
          path: dist/

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run HTML Validation (optional)
        run: |
          echo "No tests for static site. Skipping or add HTML/CSS lint here."

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Website Files
        uses: actions/download-artifact@v4
        with:
          name: static-files

      - name: Build Docker Image
        run: docker build -t static-website:latest .

      - name: Save Docker Image
        run: docker save static-website:latest -o static-website.tar

      - name: Upload Docker Image Tar
        uses: actions/upload-artifact@v4
        with:
          name: static-docker-image
          path: static-website.tar

    docker-tag:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: static-docker-image

      - name: Load and Tag Image
        run: |
          docker load -i static-website.tar
          COMMIT_SHA=${GITHUB_SHA::7}
          docker tag static-website:latest ${{ secrets.DOCKER_USERNAME }}/static-website:latest
          docker tag static-website:latest ${{ secrets.DOCKER_USERNAME }}/static-website:$COMMIT_SHA

      - name: Save Tagged Image
        run: |
          docker save ${{ secrets.DOCKER_USERNAME }}/static-website:latest -o latest.tar
          docker save ${{ secrets.DOCKER_USERNAME }}/static-website:${GITHUB_SHA::7} -o commit.tar

      - name: Upload Tagged Images
        uses: actions/upload-artifact@v4
        with:
          name: tagged-docker-images
          path: |
            latest.tar
            commit.tar

    docker-push:
    runs-on: ubuntu-latest
    needs: docker-tag

    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Download Tagged Docker Images
        uses: actions/download-artifact@v4
        with:
          name: tagged-docker-images

      - name: Load and Push Docker Images
        run: |
          docker load -i latest.tar
          docker load -i commit.tar
          docker push ${{ secrets.DOCKER_USERNAME }}/static-website:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/static-website:${GITHUB_SHA::7}


